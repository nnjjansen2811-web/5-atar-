<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffffff;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
    }
    #clock {
      color: #808080;
      font-size: 64px;
    }
  </style>
</head>
<body>
  <div id="clock"></div>
  <script>
    function updateClock() {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
